<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#ff6ec7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="white" stroke-width="3" opacity="0.25"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="white" stroke-width="2" opacity="0.18"/>
  <text x="256" y="340" font-family="Space Grotesk, Arial, sans-serif" font-size="280" font-weight="700" text-anchor="middle" fill="white" filter="url(#glow)">C</text>
</svg>
